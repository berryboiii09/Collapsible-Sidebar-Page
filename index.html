<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsible Sidebar</title>
    <link rel="stylesheet" href="css/style.css">
    <!--icons from fontawesome-->
    <script src="https://kit.fontawesome.com/6d9e11e21d.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="closeBtn">&times;</button>
        <img src="img/logo2.png" width=200px height=38px m>
        <nav>
            <ul>
                <li><a href="#home"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="#about"><i class="fa-solid fa-address-card"></i> About</a></li>
                <li><a href="#services"><i class="fa-solid fa-screwdriver-wrench"></i> Services</a></li>
                <li><a href="#contact"><i class="fa-solid fa-address-book"></i> Contact</a></li>
                <li><a href="#ourlocations>"><i class="fa-solid fa-location-dot"></i> Our Locations</a></li>
            </ul>
        </nav>
    </div>

    <!--overlay for mobile-->
    <div class="overlay" id="overlay"></div>

    <div class="main-content">
        
        <header>
            <button class="menu-btn" id="menuBtn">&#9776;</button>
        </header>

        <main>
            <h1>Welcome to this site</h1>
            <p>Click on the top left button to open the sidebar</p>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
